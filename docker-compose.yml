services:
  mongodb:
    image: mongo:7.0
    container_name: forensight-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=forensight
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  blockchain:
    image: trufflesuite/ganache:v7.9.2
    container_name: forensight-blockchain
    command: ["--server.port", "8545", "--wallet.deterministic"]
    ports:
      - "8545:8545"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forensight-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=forensight
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - FALLBACK_TO_DB_ANCHOR=true
    volumes:
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      blockchain:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forensight-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local
